spring.application.name=ItauJava

# Nível de log da aplicação (TRACE, DEBUG, INFO, WARN, ERROR).
# Use DEBUG para ver detalhes das transações e o tempo de cálculo das estatísticas.
# Pode ser sobrescrito sem recompilar: ./mvnw spring-boot:run -Dspring-boot.run.arguments=--logging.level.com.kauegalons.transactions=DEBUG
logging.level.com.kauegalons.transactions=INFO

estatistica.segundos=60
